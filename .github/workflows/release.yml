name: Release

# Tag-driven: pushing v1.2.3 publishes that version, and nothing else does.
#
#   git tag -a v1.2.3 -m "..." && git push origin v1.2.3
#
# To re-run a failed publish without inventing a new version number, dispatch this
# workflow manually and pick the tag itself in the "Use workflow from" selector —
# that makes github.ref the tag, so every step below behaves exactly as it did on
# the original push. Dispatching from a branch is refused rather than half-working.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release in progress: a half-uploaded set of assets is worse than
# waiting for the previous run to finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The release gate. Publishing a broken binary is worse than publishing late, so
  # the checks CI runs have to pass against the tagged commit before anything leaves
  # the runner.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: This workflow only publishes tags
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Ref is '${{ github.ref }}', which is not a tag."
          echo "Dispatch this workflow with a v* tag selected as the ref."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read the version from go.mod, so bumping the directive is the only place
          # a Go version is ever written down.
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd: $unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go test -race ./...

  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          name="redis-monitor"
          [ "$GOOS" = "windows" ] && name="redis-monitor.exe"

          # -trimpath keeps absolute runner paths out of the binary, so the same
          # source produces the same bytes wherever it is built.
          go build -trimpath \
            -ldflags="-s -w \
              -X main.version=${VERSION} \
              -X main.commit=${GITHUB_SHA::7} \
              -X main.builtAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/${name}" ./cmd/redis-monitor

          # The docs travel with the binary: a download with no annotated
          # .env.example is a configuration guessing game.
          cp README.md .env.example dist/

          cd dist
          stem="redis-monitor_${VERSION}_${GOOS}_${GOARCH}"

          if [ "$GOOS" = "windows" ]; then
            zip -q "../${stem}.zip" "$name" README.md .env.example
          else
            tar -czf "../${stem}.tar.gz" "$name" README.md .env.example
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: redis-monitor_*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, so the notes can be generated against the
          # previous tag.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum redis-monitor_* > checksums.txt
          cat checksums.txt

      - name: Notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          previous=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)

          {
            echo "## Container image"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${VERSION#v}"
            echo '```'
            echo
            echo "linux/amd64 and linux/arm64."
            echo
            echo "## Binaries"
            echo
            echo "Static, no runtime dependencies, UI embedded in the binary."
            echo "Verify with \`sha256sum -c checksums.txt\`."
            echo
            echo "## Changes"
            echo

            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s (%h)' "${previous}..${VERSION}"
              echo
              echo "[Full diff](https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${VERSION})"
            else
              echo "First release."
            fi
          } > notes.md

          cat notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Idempotent, so a re-run after a partial failure replaces the assets
          # rather than erroring on a release that already exists.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --notes-file notes.md
            gh release upload "$VERSION" artifacts/* --clobber
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file notes.md \
              artifacts/*
          fi

  image:
    name: Publish image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 needs an emulator present to assemble the final image layer, even
      # though the Go build itself cross-compiles natively — see the Dockerfile.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 publishes 1.2.3, 1.2, 1 and latest, so a deployment can pin as
          # tightly or as loosely as it likes. A prerelease tag (v1.2.3-rc1) gets
          # only its own exact tag — this action leaves latest and the truncated
          # tags alone for those, which is what stops an rc becoming :latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: latest=auto

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          # Without this, buildx adds an attestation manifest that shows up as an
          # "unknown/unknown" platform on the package page.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The published image runs
        run: docker run --rm "${IMAGE}:${GITHUB_REF_NAME#v}" -version
